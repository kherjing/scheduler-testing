
name: Fresh Repository Scheduler Test

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check automatic scheduler
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "UTC time:"
          date -u
          echo "Malaysia time:"
          TZ=Asia/Kuala_Lumpur date
